
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sint-Martinus Lesplanner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #edf3f9;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #173e61;
    }
    .card {
      width: min(430px, calc(100% - 32px));
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #123b6619;
    }
    h1 { margin-top: 0; }
    p { line-height: 1.5; }
    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
    }
    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font: inherit;
    }
    input { border: 1px solid #b8cadb; }
    button {
      margin-top: 20px;
      background: #176da9;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #app { display: none; }
    #message { color: #ad2930; }
  </style>
</head>
<body>

  <section class="card" id="login">
    <h1>Sint-Martinus Lesplanner</h1>
    <p>Beveiligde toegang voor leerkrachten.</p>

    <form id="loginForm">
      <label for="email">E-mailadres</label>
      <input id="email" type="email" required>

      <label for="password">Wachtwoord</label>
      <input id="password" type="password" required>

      <button id="submit" type="submit">
        Aanmelden
      </button>
      <p id="message" role="alert"></p>
    </form>
  </section>

  <section class="card" id="app">
    <h1>Sint-Martinus Lesplanner</h1>
    <p id="welcome"></p>
    <p>
      Aanmelding gelukt.
      De volledige online lesplanner wordt
      in de volgende stap gekoppeld.
    </p>
    <button id="logout">Afmelden</button>
  </section>

  <script type="module">
    import { Client, Account } from
      "https://cdn.jsdelivr.net/npm/appwrite@17.0.0/+esm";

    const client = new Client()
      .setEndpoint("https://fra.cloud.appwrite.io/v1")
      .setProject("6af77aa00021b3e71ecc");

    const account = new Account(client);

    const login = document.getElementById("login");
    const app = document.getElementById("app");
    const message = document.getElementById("message");

    function showLogin() {
      app.style.display = "none";
      login.style.display = "block";
    }

    function showApp(user) {
      login.style.display = "none";
      app.style.display = "block";
      document.getElementById("welcome").textContent =
        "Welkom, " + (user.name || user.email);
    }

    async function checkLogin() {
      try {
        const user = await account.get();
        showApp(user);
      } catch {
        showLogin();
      }
    }

    document.getElementById("loginForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";

        const button = document.getElementById("submit");
        button.disabled = true;

        try {
          await account.createEmailPasswordSession({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          });

          await checkLogin();
        } catch (error) {
          message.textContent =
            "Aanmelden mislukt. Controleer je gegevens.";
          console.error(error);
        } finally {
          button.disabled = false;
        }
      });

    document.getElementById("logout")
      .addEventListener("click", async () => {
        try {
          await account.deleteSession({
            sessionId: "current"
          });
        } finally {
          showLogin();
        }
      });

    checkLogin();
  </script>
</body>
</html>
